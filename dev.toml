# Everything this project needs, in one file.
#   flake.nix reads it (builtins.fromTOML) to build the shell
#   the `dev` CLI reads it to know the verbs
#
# Aure is a native macOS app. Swift comes from the system (Xcode Command Line
# Tools or Xcode 16+), not from Nix; Nix only provides the supporting tools.
name = "aure"
repo = "tiagocolombo/aure"
description = "Aure: offline grammar and tone assistant for macOS"

[toolchain]
node = 22
pnpm = 10     # Chrome extension (extension/chrome)
# Anything else, named as it is in nixpkgs.
packages = ["gh", "cmake"]

[commands]
test = "scripts/test.sh"
lint = "scripts/lint.sh"
build = "scripts/build-app.sh"
dmg = "scripts/make-dmg.sh"
llama = "scripts/build-llama.sh"
run = "scripts/run-app.sh"
