# Keep GitHub Actions pinned to up-to-date commit SHAs. The app has no
# third-party Swift packages yet; add a "swift" entry when it does.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
