# Keep GitHub Actions pinned to up-to-date commit SHAs, and Sparkle (the only
# Swift package, used for in-app updates) current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: swift
    directory: /Packages/AureKit
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
