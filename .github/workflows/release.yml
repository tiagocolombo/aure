# Publishes a GitHub release after CI passes on main. The version comes from
# the conventional commits since the last tag (scripts/next-version.sh); the
# release carries the DMG and the Sparkle feed (appcast.xml) that installed
# copies of Aure check for updates.
#
# One-time setup: scripts/setup-release-secrets.sh (signing identity and
# Sparkle key). Until those secrets exist this workflow skips with a warning.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    # Only reviewed code on main ever reaches the signing secrets.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
       && github.event.workflow_run.head_branch == 'main')
    runs-on: macos-15
    timeout-minutes: 60
    # The signing identity and Sparkle key are environment secrets: only jobs that
    # deploy to "release" (from main, per the environment's branch rule) get them.
    environment: release
    permissions:
      contents: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check release secrets
        id: secrets
        env:
          P12: ${{ secrets.AURE_SIGNING_P12 }}
          SPARKLE: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$P12" ] || [ -z "$SPARKLE" ] || grep -q '__SPARKLE_PUBLIC_KEY__' Resources/Info.plist; then
            echo "::warning::Release skipped: run scripts/setup-release-secrets.sh and commit Resources/Info.plist first."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Next version
        id: version
        if: steps.secrets.outputs.ready == 'true'
        run: |
          version="$(scripts/next-version.sh)"
          if [ -z "$version" ]; then echo "Nothing new since the last release."; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Select Xcode 16
        if: steps.version.outputs.version != ''
        run: sudo xcode-select -s "$(printf '%s\n' /Applications/Xcode_16*.app | sort -V | tail -1)"

      # Built from source every time: this job holds signing secrets, so it must
      # not restore a cache that another workflow could have written.
      - name: Build llama-server (universal)
        if: steps.version.outputs.version != ''
        run: scripts/build-llama.sh

      # A throwaway keychain holding the stable "Aure Local" identity. Referenced
      # by hash, so the self-signed certificate does not need to be trusted here.
      - name: Import signing identity
        if: steps.version.outputs.version != ''
        env:
          P12: ${{ secrets.AURE_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.AURE_SIGNING_P12_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/aure.keychain-db"
          kc_pass="$(uuidgen)"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/aure.p12"
          security import "$RUNNER_TEMP/aure.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/aure.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          hash="$(security find-identity -p codesigning "$kc" | awk '/"Aure Local"/ { print $2; exit }')"
          if [ -z "$hash" ]; then
            # Names only: what the .p12 held, to tell a missing key from a wrong certificate.
            echo "Code-signing identities imported:"; security find-identity -p codesigning "$kc"
            echo "Certificates imported:"; security find-certificate -a "$kc" | grep '"labl"' || echo "  none"
            echo "::error::No 'Aure Local' identity in AURE_SIGNING_P12. Check the file with scripts/check-signing-p12.sh before uploading it."
            exit 1
          fi
          echo "AURE_SIGN_IDENTITY=$hash" >> "$GITHUB_ENV"

      - name: Build Aure.app (universal, release)
        if: steps.version.outputs.version != ''
        env:
          AURE_VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-app.sh release

      - name: Package DMG and appcast
        if: steps.version.outputs.version != ''
        env:
          AURE_SKIP_BUILD: "1"
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/make-dmg.sh
          scripts/make-appcast.sh "dist/Aure-$VERSION.dmg" "$VERSION" "$GITHUB_REPOSITORY"

      - name: Publish GitHub release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "dist/Aure-$VERSION.dmg" dist/appcast.xml \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "Aure $VERSION" --generate-notes

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/aure.keychain-db" 2>/dev/null || true
